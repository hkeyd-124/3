<style>

/* ---------------------------------------------------------
   PAGE SHELL
   --------------------------------------------------------- */
.resources-page{
  padding:var(--hc-space-6);
  /* scroll area */
  height:calc(100vh - 120px);
  overflow-y:scroll;
  overflow-x:hidden;
}

.resources-page::-webkit-scrollbar{
  width:10px;
}

.resources-page::-webkit-scrollbar-track{
  background:var(--hc-line);
  border-radius:var(--hc-radius-pill);
}

.resources-page::-webkit-scrollbar-thumb{
  background:var(--hc-navy-500);
  border-radius:var(--hc-radius-pill);
}

.resources-page::-webkit-scrollbar-thumb:hover{
  background:var(--hc-navy-700);
}

.resources-container{
  max-width:900px;
  margin:auto;
}

.resources-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:var(--hc-space-6);
}

.resources-title{
  font-size:var(--hc-fs-3xl);
  font-weight:var(--hc-fw-black);
  letter-spacing:var(--hc-ls-close);
  color:var(--hc-text);
}

/* TIER C — plain rounded control (decision #2: no chamfer here) */
.back-btn{
  padding:var(--hc-space-3) var(--hc-space-5);
  background:var(--hc-navy-900);
  color:var(--hc-white);
  border-radius:var(--hc-radius-md);
  cursor:pointer;
  font-weight:var(--hc-fw-semi);
  transition:background var(--hc-dur-base) var(--hc-ease);
}

.back-btn:hover{
  background:var(--hc-navy-600);
}

/* ---------------------------------------------------------
   TIER B — TOPIC CARD  (decision #2: chamfered "tab card")
   ---------------------------------------------------------
   Geometry note (same class of bug as the PHASE 2 pilot):
   the v4 chamfer tokens are pure PERCENTAGES, so the cut scales
   with the box. On a short, wide row the corner stops being 45°
   and the inner hairline — which sits on a smaller box — stops
   running parallel to the outer edge, showing as a "ghost border".

   FIX: a FIXED px cut on BOTH axes. The corner stays a true 45°
   at every width, and the inner hairline reuses the SAME polygon
   so the two cuts are parallel by construction.
   --------------------------------------------------------- */
.topic{
  --row-cut:10px;
  position:relative;
  border:1px solid var(--hc-border-strong);
  padding:var(--hc-space-5);
  margin-bottom:var(--hc-space-4);
  cursor:pointer;
  font-weight:var(--hc-fw-semi);
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--hc-surface);
  color:var(--hc-text);
  clip-path:polygon(
    0 var(--row-cut),
    var(--row-cut) 0,
    calc(100% - var(--row-cut)) 0,
    100% var(--row-cut),
    100% calc(100% - var(--row-cut)),
    calc(100% - var(--row-cut)) 100%,
    var(--row-cut) 100%,
    0 calc(100% - var(--row-cut))
  );
  transition:transform var(--hc-dur-base) var(--hc-ease),
             background var(--hc-dur-base) var(--hc-ease);
}

/* inner hairline — same polygon, inset 5px, so the cuts stay parallel.
   position:absolute => NOT a flex item => space-between is untouched. */
.topic::before{
  content:"";
  position:absolute;
  inset:5px;
  border:1px solid var(--hc-border);
  clip-path:polygon(
    0 var(--row-cut),
    var(--row-cut) 0,
    calc(100% - var(--row-cut)) 0,
    100% var(--row-cut),
    100% calc(100% - var(--row-cut)),
    calc(100% - var(--row-cut)) 100%,
    var(--row-cut) 100%,
    0 calc(100% - var(--row-cut))
  );
  pointer-events:none;
}

.topic:hover{
  transform:translateY(-2px);
}

/* LESSON LIST */

.lesson-list{
  display:none;
  margin-left:var(--hc-space-6);
  margin-bottom:var(--hc-space-6);
}

/* ---------------------------------------------------------
   TIER C — LESSON ROW  (decision #2: plain rounded, no chamfer)
   --------------------------------------------------------- */
.lesson{
  position:relative;
  border:1px solid var(--hc-border);
  padding:var(--hc-space-4);
  border-radius:var(--hc-radius-md);
  margin-top:var(--hc-space-3);
  cursor:pointer;
  background:var(--hc-surface);
  color:var(--hc-text);
  transition:var(--hc-dur-base);
}

.lesson:hover{
  background:var(--hc-row-tint);
  transform:translateX(5px);
}

</style>
