<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HackChem Admin</title>
</head>

<body>

    <h1>🧪 HackChem Admin</h1>

    <hr>

    <div id="status">
        Checking permission...
    </div>

    <script type="module">

        import {
            ensureAdmin
        } from "./js/core/adminGuard.js";

        try {

            const admin = await ensureAdmin();

            document.getElementById("status").innerHTML = `
                <h2>✅ Access Granted</h2>

                <p><b>Name:</b> ${admin.name ?? "-"}</p>

                <p><b>UID:</b> ${admin.uid ?? "-"}</p>

                <p><b>Email:</b> ${admin.email ?? "-"}</p>

                <p><b>Role:</b> ${admin.system?.role ?? "-"}</p>

                <p><b>Status:</b> ${admin.system?.status ?? "-"}</p>
            `;

            console.log("Admin:", admin);

        } catch (err) {

            console.error(err);

            document.getElementById("status").innerHTML = `
                <h2>❌ Admin Guard Error</h2>
                <pre>${err}</pre>
            `;

        }

    </script>

</body>

</html>
